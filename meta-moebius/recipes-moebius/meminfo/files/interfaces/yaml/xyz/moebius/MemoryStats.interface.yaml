description: >
    Memory statistics provided by the moebius virtual BMC extension.
properties:
    - name: MemTotal
      type: uint64
      description: >
          Total usable RAM in KB, as reported by /proc/meminfo
    - name: MemAvailable
      type: uint64
      description: >
          Available RAM in KB, as reported by /proc/meminfo.
methods:
    - name: Refresh
      description: >
          Force an immediate re-read of memory statistics.
