# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "moebius-layer"
BBFILE_PATTERN_moebius-layer := "^${LAYERDIR}/"
BBFILE_PRIORITY_moebius-layer = "6"

LAYERSERIES_COMPAT_moebius-layer = "wrynose whinlatter"

# Declare layer dependencies once recipes actually need them, e.g.:
# LAYERDEPENDS_moebius-layer = "phosphor-layer openpower-layer"
